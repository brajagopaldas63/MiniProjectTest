spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/nit
spring.datasource.username=root
spring.datasource.password=mypassword1


spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update



management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,loggers

management.endpoint.health.show-details=always


# ==============================
# SPRING BOOT ADMIN CLIENT
# ==============================

spring.boot.admin.client.url=http://localhost:9999



# Feign Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.IPLTeamService.register-health-indicator=true
resilience4j.circuitbreaker.instances.IPLTeamService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.IPLTeamService.sliding-window-size=5
resilience4j.circuitbreaker.instances.IPLTeamService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.IPLTeamService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.IPLTeamService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.IPLTeamService.permitted-number-of-calls-in-half-open-state=2
